<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: aqua;
            height: 200px;
            width: 200px;
            z-index: 5;
            position: relative;
        }

        .BOX{
            background-color: black;
            height: 200px;
            width: 200px;
            position: absolute;
            left: 150px;
            top: 150px;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="box"></div>
    <div class="BOX"></div>
</body>
</html>
